function ensureHeatCapture() {
  if (heatVideo || heatPending || heatFailed) return;
  heatPending = true;
  window.bridge.setProtect(true);
  navigator.mediaDevices.getDisplayMedia({ audio: false, video: { frameRate: 30 } })
    .then(stream => {
      heatVideo = document.createElement('video');
      heatVideo.srcObject = stream;
      heatVideo.muted = true;
      return heatVideo.play();
    })
    .then(() => {
      heatPending = false;
      warmHeatShader(0);
    })
    .catch(() => {
      heatVideo = null;
      heatFailed = true;
      heatPending = false;
      window.bridge.setProtect(false);
    });
}

function warmHeatShader(attempt) {
  if (!heatVideo) return;
  if (heatVideo.videoWidth === 0) {
    if (attempt < 25) setTimeout(() => warmHeatShader(attempt + 1), 120);
    return;
  }
  initGL();
  if (!gl) return;
  try {
    if (glCv.width !== W || glCv.height !== H) {
      glCv.width = W;
      glCv.height = H;
    }
    gl.viewport(0, 0, W, H);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, glTexScreen);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, heatVideo);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, glTexHeat);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, fireGW, fireGH, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, fireGrid);
    gl.uniform1f(glULoc.time, 0);
    gl.uniform2f(glULoc.texel, 1 / W, 1 / H);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } catch {}
}

function stopHeatCapture() {
  if (heatVideo && heatVideo.srcObject) {
    for (const t of heatVideo.srcObject.getTracks()) t.stop();
  }
  heatVideo = null;
  window.bridge.setProtect(false);
}

const glCv = document.createElement('canvas');
let gl = null;
let glProg = null;
let glTexScreen = null;
let glTexHeat = null;
let glULoc = null;
let glFailed = false;

function initGL() {
  if (gl || glFailed) return;
  try {
    gl = glCv.getContext('webgl', { premultipliedAlpha: true, alpha: true });
    if (!gl) throw new Error('webgl unavailable');
    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, 'attribute vec2 aPos; varying vec2 vUv; void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }');
    gl.compileShader(vs);
    if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(vs));
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, [
      'precision mediump float;',
      'varying vec2 vUv;',
      'uniform sampler2D uScreen;',
      'uniform sampler2D uHeat;',
      'uniform float uTime;',
      'uniform vec2 uTexel;',
      'void main() {',
      '  float h0 = texture2D(uHeat, vUv).r;',
      '  float h1 = texture2D(uHeat, vUv + vec2(0.004, 0.0)).r;',
      '  float h2 = texture2D(uHeat, vUv - vec2(0.004, 0.0)).r;',
      '  float h3 = texture2D(uHeat, vUv + vec2(0.0, 0.006)).r;',
      '  float r1 = texture2D(uHeat, vUv - vec2(0.0, uTexel.y * 18.0)).r;',
      '  float r2 = texture2D(uHeat, vUv - vec2(0.0, uTexel.y * 38.0)).r;',
      '  float r3 = texture2D(uHeat, vUv - vec2(0.0, uTexel.y * 62.0)).r;',
      '  float rising = r1 * 0.5 + r2 * 0.28 + r3 * 0.14;',
      '  float heat = max((h0 * 2.0 + h1 + h2 + h3) / 5.0, rising);',
      '  float amp = smoothstep(0.02, 0.2, heat);',
      '  vec2 px = vUv / uTexel;',
      '  vec2 off = vec2(',
      '    sin(px.y * 0.045 + uTime * 1.9 + px.x * 0.012) + 0.6 * sin(px.y * 0.11 - uTime * 2.7 + px.x * 0.03),',
      '    0.5 * sin(px.x * 0.04 + uTime * 2.2) + 0.35 * sin(px.y * 0.06 + uTime * 1.4)',
      '  ) * amp * 2.0;',
      '  vec3 col = texture2D(uScreen, vUv + off * uTexel).rgb;',
      '  gl_FragColor = vec4(col * amp, amp);',
      '}',
    ].join('\n'));
    gl.compileShader(fs);
    if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(fs));
    glProg = gl.createProgram();
    gl.attachShader(glProg, vs);
    gl.attachShader(glProg, fs);
    gl.linkProgram(glProg);
    if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) throw new Error('link failed');
    gl.useProgram(glProg);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(glProg, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    glTexScreen = gl.createTexture();
    glTexHeat = gl.createTexture();
    for (const t of [glTexScreen, glTexHeat]) {
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    }
    glULoc = {
      screen: gl.getUniformLocation(glProg, 'uScreen'),
      heat: gl.getUniformLocation(glProg, 'uHeat'),
      time: gl.getUniformLocation(glProg, 'uTime'),
      texel: gl.getUniformLocation(glProg, 'uTexel'),
    };
    gl.uniform1i(glULoc.screen, 0);
    gl.uniform1i(glULoc.heat, 1);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.clearColor(0, 0, 0, 0);
    console.log('heat shader ready');
  } catch (e) {
    console.warn('heat shader init failed:', e && e.message);
    gl = null;
    glFailed = true;
  }
}

function drawHeatShader() {
  if (fireActive <= 0) return;
  if (!heatVideo || heatVideo.videoWidth === 0) return;
  initGL();
  if (!gl) return;
  if (glCv.width !== W || glCv.height !== H) {
    glCv.width = W;
    glCv.height = H;
  }
  try {
    gl.viewport(0, 0, W, H);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, glTexScreen);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, heatVideo);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, glTexHeat);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, fireGW, fireGH, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, fireGrid);
    gl.uniform1f(glULoc.time, fireFrame * 0.1);
    gl.uniform2f(glULoc.texel, 1 / W, 1 / H);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    ctx.drawImage(glCv, 0, 0, W, H);
  } catch (e) {}
}

function buildFirePalette(levels) {
  const hex = [
    0x000000, 0x1F0707, 0x2F0F07, 0x470F07, 0x571707, 0x671F07, 0x771F07,
    0x8F2707, 0x9F2F07, 0xAF3F07, 0xBF4707, 0xC74707, 0xDF4F07, 0xDF5707,
    0xDF5707, 0xD75F07, 0xD75F07, 0xD7670F, 0xCF6F0F, 0xCF770F, 0xCF7F0F,
    0xCF8717, 0xC78717, 0xC78F17, 0xC7971F, 0xBF9F1F, 0xBF9F1F, 0xBFA727,
    0xBFA727, 0xBFAF2F, 0xB7AF2F, 0xB7B72F, 0xB7B737, 0xCFCF6F, 0xDFDF9F,
    0xEFEFC7, 0xFFFFFF,
  ];
  const pal = [];
  for (let i = 0; i <= levels; i++) {
    const t = i / levels * (hex.length - 1);
    const lo = hex[Math.floor(t)];
    const hi = hex[Math.min(hex.length - 1, Math.ceil(t))];
    const f = t - Math.floor(t);
    pal.push([
      Math.round(((lo >> 16) & 255) * (1 - f) + ((hi >> 16) & 255) * f),
      Math.round(((lo >> 8) & 255) * (1 - f) + ((hi >> 8) & 255) * f),
      Math.round((lo & 255) * (1 - f) + (hi & 255) * f),
      i < 6 ? 0 : 235,
    ]);
  }
  return pal;
}

function colorLum(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}

function shadeColor(hex, amt) {
  const ch = i => Math.max(0, Math.min(255, parseInt(hex.slice(i, i + 2), 16) + amt));
  return '#' + [1, 3, 5].map(i => ch(i).toString(16).padStart(2, '0')).join('');
}

function autoOutline(hex) {
  return colorLum(hex) > 0.5 ? shadeColor(hex, -90) : shadeColor(hex, 100);
}

function haloFor(hex) {
  return colorLum(hex) > 0.6 ? '#333' : '#fff';
}

function spawnWhip(mx, my) {
  dropping = false;
  lastCrackTime = 0;
  whipSpawnTime = Date.now();
  segCount = P.segments;
  if (myWhipType === 'long') segCount = P.segments * 2;
  if (myWhipType === 'machine') segCount = Math.round(P.segments * P.machineSegFactor);
  if (myWhipType === 'gun') segCount = 1;
  machineAngle = -Math.PI / 2;
  machineSpeed = P.machineBaseSpeed;
  machineHubX = mx;
  machineHubY = my;
  const arcW = P.arcWidth * (myWhipType === 'long' ? 1.7 : 1);
  const pts = [];
  for (let i = 0; i < segCount; i++) {
    const t = i / (segCount - 1);
    const x = mx + t * arcW;
    const y = my - Math.sin(t * Math.PI * 0.75) * P.arcHeight;
    pts.push({ x, y, px: x, py: y });
  }
  return pts;
}

function segLen(i) {
  const t = i / (segCount - 1);
  return P.segmentLength * (1 - t * (1 - P.taper));
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;

function catmullPoint(pts, i) {
  const n = pts.length;
  if (n === 0) return { x: 0, y: 0 };
  if (i < 0) {
    if (n >= 2) {
      return { x: 2 * pts[0].x - pts[1].x, y: 2 * pts[0].y - pts[1].y };
    }
    return { x: pts[0].x, y: pts[0].y };
  }
  if (i >= n) {
    if (n >= 2) {
      const a = pts[n - 2], b = pts[n - 1];
      return { x: 2 * b.x - a.x, y: 2 * b.y - a.y };
    }
    return { x: pts[n - 1].x, y: pts[n - 1].y };
  }
  return pts[i];
}

function whipSegmentBezier(pts, i) {
  const p0 = catmullPoint(pts, i - 1);
  const p1 = pts[i];
  const p2 = pts[i + 1];
  const p3 = catmullPoint(pts, i + 2);
  return {
    cp1x: p1.x + (p2.x - p0.x) / 6,
    cp1y: p1.y + (p2.y - p0.y) / 6,
    cp2x: p2.x - (p3.x - p1.x) / 6,
    cp2y: p2.y - (p3.y - p1.y) / 6,
    x2: p2.x,
    y2: p2.y,
  };
}
const wrapPi = a => {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
};

const sndCache = {};

function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}

function sndBuf(name) {
  if (!sndCache[name]) {
    ensureAudioCtx();
    sndCache[name] = window.bridge.readSound(name).then(b64 => new Promise((resolve, reject) => {
      const bin = atob(b64);
      const ab = new ArrayBuffer(bin.length);
      const u8 = new Uint8Array(ab);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      audioCtx.decodeAudioData(ab, resolve, reject);
    }));
    sndCache[name].catch(() => { delete sndCache[name]; });
  }
  return sndCache[name];
}

function panFrom(xNorm) {
  if (typeof xNorm !== 'number' || !isFinite(xNorm)) return 0;
  return Math.max(-0.4, Math.min(0.4, (xNorm * 2 - 1) * 0.4));
}

function playSnd(name, vol, rate, pan) {
  if (vol <= 0) return;
  ensureAudioCtx();
  sndBuf(name).then(buf => {
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = rate || 1;
    const g = audioCtx.createGain();
    g.gain.value = vol;
    const pn = audioCtx.createStereoPanner();
    pn.pan.value = pan || 0;
    src.connect(g);
    g.connect(pn);
    pn.connect(audioCtx.destination);
    src.start();
  }).catch(e => {
    console.warn('webaudio failed, falling back:', e && e.message);
    const a = new Audio('sounds/' + name);
    a.volume = vol;
    a.preservesPitch = false;
    a.playbackRate = rate || 1;
    a.play().catch(() => {});
  });
}

function playGunfire(xNorm) {
  playSnd('gunfire.mp3', sfxVol(), 1, panFrom(xNorm));
}

function synthImpact(vol, pan) {
  ensureAudioCtx();
  const t0 = audioCtx.currentTime;
  const pn = audioCtx.createStereoPanner();
  pn.pan.value = pan;
  pn.connect(audioCtx.destination);
  const o1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  o1.type = 'square';
  o1.frequency.setValueAtTime(1500, t0);
  o1.frequency.exponentialRampToValueAtTime(400, t0 + 0.08);
  g1.gain.setValueAtTime(vol * 0.4, t0);
  g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
  o1.connect(g1);
  g1.connect(pn);
  o1.start(t0);
  o1.stop(t0 + 0.1);
  const o2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(260, t0);
  o2.frequency.exponentialRampToValueAtTime(70, t0 + 0.12);
  g2.gain.setValueAtTime(vol, t0);
  g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
  o2.connect(g2);
  g2.connect(pn);
  o2.start(t0);
  o2.stop(t0 + 0.16);
}

function playImpact(xNorm) {
  const vol = sfxVol();
  if (vol <= 0) return;
  const pan = panFrom(xNorm);
  playSnd('cursorimpact.wav', Math.min(1.5, vol * 1.8), 1, pan);
  synthImpact(Math.min(1, vol * 1.1), pan);
}

const sparks = [];

function spawnSparks(x, y, vx, vy) {
  const d = Math.hypot(vx, vy) || 1;
  const ux = vx / d;
  const uy = vy / d;
  for (let i = 0; i < 22; i++) {
    const spread = (Math.random() - 0.5) * 2.4;
    const cs = Math.cos(spread);
    const sn = Math.sin(spread);
    const sp = 3 + Math.random() * 13;
    sparks.push({
      x, y,
      vx: (ux * cs - uy * sn) * sp + (Math.random() - 0.5) * 2,
      vy: (ux * sn + uy * cs) * sp + (Math.random() - 0.5) * 2 - 2,
      life: 1,
      decay: 0.03 + Math.random() * 0.04,
    });
  }
}

function updateSparks() {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vx *= 0.96;
    s.vy = s.vy * 0.96 + 0.5;
    s.life -= s.decay;
    if (s.life <= 0) sparks.splice(i, 1);
  }
}

function drawSparks() {
  if (!sparks.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.lineWidth = 2;
  for (const s of sparks) {
    ctx.strokeStyle = s.col
      ? 'rgba(' + s.col[0] + ',' + s.col[1] + ',' + s.col[2] + ',' + (0.9 * s.life) + ')'
      : 'rgba(255,' + Math.round(150 + 105 * s.life) + ',' + Math.round(70 * s.life) + ',' + (0.9 * s.life) + ')';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.vx * 1.6, s.y - s.vy * 1.6);
    ctx.stroke();
  }
  ctx.restore();
}

function playThud(intensity, xNorm) {
  const vol = sfxVol() * intensity;
  if (vol <= 0.01) return;
  ensureAudioCtx();
  const t0 = audioCtx.currentTime;
  const pn = audioCtx.createStereoPanner();
  pn.pan.value = panFrom(xNorm);
  pn.connect(audioCtx.destination);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(85 + 70 * intensity, t0);
  osc.frequency.exponentialRampToValueAtTime(42, t0 + 0.13);
  gain.gain.setValueAtTime(Math.min(1, vol * 2), t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
  osc.connect(gain);
  gain.connect(pn);
  osc.start(t0);
  osc.stop(t0 + 0.2);
  const o2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(240 + 120 * intensity, t0);
  o2.frequency.exponentialRampToValueAtTime(90, t0 + 0.06);
  g2.gain.setValueAtTime(Math.min(0.7, vol * 1.2), t0);
  g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.08);
  o2.connect(g2);
  g2.connect(pn);
  o2.start(t0);
  o2.stop(t0 + 0.09);
}

function simulateKnockThuds(x0, y0, kvx, kvy) {
  let x = x0;
  let y = y0;
  let vX = kvx;
  let vY = kvy;
  let ticks = 0;
  let count = 0;
  while (ticks < 150 && count < 4 && (Math.abs(vX) > 0.7 || Math.abs(vY) > 0.7)) {
    x += vX;
    y += vY;
    vX *= 0.93;
    vY *= 0.93;
    let impact = 0;
    if (x < 0) { x = 0; impact = Math.abs(vX); vX = Math.abs(vX) * 0.65; }
    else if (x > W - 1) { x = W - 1; impact = Math.abs(vX); vX = -Math.abs(vX) * 0.65; }
    if (y < 0) { y = 0; impact = Math.max(impact, Math.abs(vY)); vY = Math.abs(vY) * 0.65; }
    else if (y > H - 1) { y = H - 1; impact = Math.max(impact, Math.abs(vY)); vY = -Math.abs(vY) * 0.65; }
    if (impact > 12) {
      count++;
      const i = Math.min(1, impact / 70);
      const px = x / W;
      setTimeout(() => playThud(i, px), ticks * 16);
    }
    ticks++;
  }
}

function drawGun(cx2, x, y, ang, flip, recoil) {
  if (!gunImgEl.complete || !gunImgEl.naturalWidth) return;
  const r = recoil || 0;
  cx2.save();
  cx2.translate(x, y);
  cx2.rotate(ang);
  if (flip) cx2.scale(1, -1);
  if (r > 0) {
    cx2.translate(-r * 14, 0);
    cx2.rotate(-r * 0.3);
  }
  cx2.drawImage(gunImgEl, -GUN_GRIP_X * GUN_S, -GUN_GRIP_Y * GUN_S, GUN_S, GUN_S);
  if (r > 0.55) {
    const f = (r - 0.55) / 0.45;
    const mxL = (GUN_MUZZLE_X - GUN_GRIP_X) * GUN_S;
    const myL = (GUN_MUZZLE_Y - GUN_GRIP_Y) * GUN_S;
    cx2.save();
    cx2.translate(mxL, myL);
    cx2.globalCompositeOperation = 'lighter';

    const glowR = 42 * f + 12;
    const glow = cx2.createRadialGradient(0, 0, 0, 0, 0, glowR);
    glow.addColorStop(0, 'rgba(255,220,140,' + 0.55 * f + ')');
    glow.addColorStop(0.5, 'rgba(255,150,40,' + 0.3 * f + ')');
    glow.addColorStop(1, 'rgba(255,90,10,0)');
    cx2.fillStyle = glow;
    cx2.beginPath();
    cx2.arc(0, 0, glowR, 0, Math.PI * 2);
    cx2.fill();

    const petals = 8;
    const baseRot = (Math.random() - 0.5) * 0.3;
    for (let i = 0; i < petals; i++) {
      const a = baseRot + (i / petals) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const dirBoost = Math.max(0, Math.cos(a));
      const L = (10 + Math.random() * 12 + 50 * dirBoost * dirBoost) * (0.45 + 0.55 * f);
      const w2 = (3 + Math.random() * 4) * (0.5 + 0.5 * f);
      cx2.save();
      cx2.rotate(a);
      const lg = cx2.createLinearGradient(0, 0, L, 0);
      lg.addColorStop(0, 'rgba(255,255,235,' + 0.9 * f + ')');
      lg.addColorStop(0.35, 'rgba(255,205,90,' + 0.75 * f + ')');
      lg.addColorStop(1, 'rgba(255,110,10,0)');
      cx2.fillStyle = lg;
      cx2.beginPath();
      cx2.moveTo(0, -w2);
      cx2.quadraticCurveTo(L * 0.5, -w2 * 0.55, L, 0);
      cx2.quadraticCurveTo(L * 0.5, w2 * 0.55, 0, w2);
      cx2.closePath();
      cx2.fill();
      cx2.restore();
    }

    const coreR = 6 + 7 * f;
    const core = cx2.createRadialGradient(0, 0, 0, 0, 0, coreR);
    core.addColorStop(0, 'rgba(255,255,255,' + 0.95 * f + ')');
    core.addColorStop(0.6, 'rgba(255,240,190,' + 0.8 * f + ')');
    core.addColorStop(1, 'rgba(255,190,80,0)');
    cx2.fillStyle = core;
    cx2.beginPath();
    cx2.arc(0, 0, coreR, 0, Math.PI * 2);
    cx2.fill();

    cx2.restore();
  }
  cx2.restore();
}

const smokes = [];

function addMuzzleFlash(x, y) {
  for (let i = 0; i < 3; i++) {
    smokes.push({
      x: x + (Math.random() - 0.5) * 10,
      y: y + (Math.random() - 0.5) * 10,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -0.5 - Math.random() * 0.8,
      r: 5 + Math.random() * 5,
      life: 1,
    });
  }
}

function updateSmokes() {
  for (let i = smokes.length - 1; i >= 0; i--) {
    const s = smokes[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vx *= 0.985;
    s.r += 0.35;
    s.life -= 0.018;
    if (s.life <= 0) smokes.splice(i, 1);
  }
}

function drawSmokes() {
  if (!smokes.length) return;
  ctx.save();
  for (const s of smokes) {
    ctx.fillStyle = 'rgba(170,170,175,' + (0.15 * s.life) + ')';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function sampleScreenColors(x, y) {
  if (!heatVideo || heatVideo.videoWidth === 0) return null;
  try {
    const kx = heatVideo.videoWidth / W;
    const ky = heatVideo.videoHeight / H;
    pickCtx.drawImage(heatVideo, Math.max(0, (x - 24) * kx), Math.max(0, (y - 24) * ky), 48 * kx, 48 * ky, 0, 0, 6, 6);
    const d = pickCtx.getImageData(0, 0, 6, 6).data;
    const cols = [];
    for (let i = 0; i < 8; i++) {
      const o = ((Math.random() * 36) | 0) * 4;
      cols.push([d[o], d[o + 1], d[o + 2]]);
    }
    return cols;
  } catch {
    return null;
  }
}

function spawnEdgeParticles(x, y, vx, vy) {
  let rvx = vx;
  let rvy = vy;
  if (x <= 0 || x >= W) rvx = -vx;
  if (y <= 0 || y >= H) rvy = -vy;
  const cols = sampleScreenColors(x, y);
  const d = Math.hypot(rvx, rvy) || 1;
  const ux = rvx / d;
  const uy = rvy / d;
  for (let i = 0; i < 16; i++) {
    const spread = (Math.random() - 0.5) * 2.2;
    const cs = Math.cos(spread);
    const sn = Math.sin(spread);
    const sp = 2 + Math.random() * 10;
    sparks.push({
      x, y,
      vx: (ux * cs - uy * sn) * sp,
      vy: (ux * sn + uy * cs) * sp - 1.5,
      life: 1,
      decay: 0.03 + Math.random() * 0.04,
      col: cols ? varyColor(cols[(Math.random() * cols.length) | 0]) : null,
    });
  }
}

function varyColor(c) {
  const lum = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
  let f = 0.75 + Math.random() * 0.7;
  let add = 0;
  if (lum < 70) add = 70 + Math.random() * 60;
  else if (lum > 200) f = 0.5 + Math.random() * 0.55;
  const cl = v => Math.max(0, Math.min(255, Math.round(v * f + add)));
  return [cl(c[0]), cl(c[1]), cl(c[2])];
}

function gunMuzzle(x, y, ang, flip) {
  const mx = (GUN_MUZZLE_X - GUN_GRIP_X) * GUN_S;
  const my = (GUN_MUZZLE_Y - GUN_GRIP_Y) * GUN_S * (flip ? -1 : 1);
  const c = Math.cos(ang);
  const s = Math.sin(ang);
  return { x: x + mx * c - my * s, y: y + mx * s + my * c };
}

function drawBullet(cx2, bl) {
  const d = Math.hypot(bl.vx, bl.vy) || 1;
  const ux = bl.vx / d;
  const uy = bl.vy / d;
  const trail = Math.min(110, d * 1.2);
  cx2.save();
  cx2.globalCompositeOperation = 'lighter';
  cx2.lineCap = 'round';
  const grad = cx2.createLinearGradient(bl.x, bl.y, bl.x - ux * trail, bl.y - uy * trail);
  grad.addColorStop(0, 'rgba(255,240,190,0.95)');
  grad.addColorStop(0.3, 'rgba(255,180,70,0.5)');
  grad.addColorStop(1, 'rgba(255,110,20,0)');
  cx2.strokeStyle = grad;
  cx2.lineWidth = 7;
  cx2.beginPath();
  cx2.moveTo(bl.x, bl.y);
  cx2.lineTo(bl.x - ux * trail, bl.y - uy * trail);
  cx2.stroke();
  cx2.strokeStyle = 'rgba(255,255,240,0.95)';
  cx2.lineWidth = 2.5;
  cx2.beginPath();
  cx2.moveTo(bl.x, bl.y);
  cx2.lineTo(bl.x - ux * trail * 0.45, bl.y - uy * trail * 0.45);
  cx2.stroke();
  const halo = cx2.createRadialGradient(bl.x, bl.y, 0, bl.x, bl.y, 11);
  halo.addColorStop(0, 'rgba(255,255,220,0.9)');
  halo.addColorStop(1, 'rgba(255,160,40,0)');
  cx2.fillStyle = halo;
  cx2.beginPath();
  cx2.arc(bl.x, bl.y, 11, 0, Math.PI * 2);
  cx2.fill();
  cx2.restore();
}

function updateGun(now) {
  let target = null;
  let best = 1e12;
  for (const c of victimCursors.values()) {
    if (now - c.t > 2000) continue;
    const d = (c.x - mouseX) * (c.x - mouseX) + (c.y - mouseY) * (c.y - mouseY);
    if (d < best) { best = d; target = c; }
  }
  let aimed = false;
  if (target) {
    const dx0 = target.x - mouseX;
    const dy0 = target.y - mouseY;
    const d = Math.hypot(dx0, dy0);
    let want = Math.atan2(dy0, dx0);
    const my = (GUN_MUZZLE_Y - GUN_GRIP_Y) * GUN_S * (gunFlip ? -1 : 1);
    if (d > Math.abs(my) + 1) want -= Math.asin(my / d);
    gunAngle = wrapPi(gunAngle + wrapPi(want - gunAngle) * 0.3);
    aimed = Math.abs(wrapPi(want - gunAngle)) < 0.12;
  }
  gunFlip = Math.abs(wrapPi(gunAngle)) > Math.PI / 2;
  if (!manualFire && target && aimed && now - lastShot >= GUN_COOLDOWN) {
    fireGunNow();
  }
}

function fireGunNow() {
  if (remoteMode || myWhipType !== 'gun' || !whip || dropping) return;
  const now = Date.now();
  if (now - lastShot < GUN_COOLDOWN) return;
  lastShot = now;
  gunRecoil = 1;
  const m = gunMuzzle(mouseX, mouseY, gunAngle, gunFlip);
  addMuzzleFlash(m.x, m.y);
  bullets.push({
    x: m.x, y: m.y,
    px: m.x, py: m.y,
    vx: Math.cos(gunAngle) * BULLET_SPEED,
    vy: Math.sin(gunAngle) * BULLET_SPEED,
    life: 240,
  });
  playGunfire(mouseX / W);
  window.bridge.whipCrack(mouseX / W);
}

function updateBullets(now) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bl = bullets[i];
    bl.px = bl.x;
    bl.py = bl.y;
    bl.x += bl.vx;
    bl.y += bl.vy;
    bl.life--;
    let hit = false;
    for (const [vid, c] of victimCursors) {
      if (now - c.t > 2000) continue;
      if (distToSegment(c.x, c.y, bl.px, bl.py, bl.x, bl.y) < 32) {
        const d = Math.hypot(bl.vx, bl.vy) || 1;
        window.bridge.sendHit(vid, bl.vx / d * GUN_KNOCK, bl.vy / d * GUN_KNOCK, 'gun');
        spawnSparks(c.x, c.y, bl.vx, bl.vy);
        playImpact(c.x / W);
        simulateKnockThuds(c.x, c.y, bl.vx / d * GUN_KNOCK, bl.vy / d * GUN_KNOCK);
        hit = true;
        break;
      }
    }
    if (hit || bl.life <= 0) {
      bullets.splice(i, 1);
      continue;
    }
    if (bl.x < 0 || bl.x > W || bl.y < 0 || bl.y > H) {
      spawnEdgeParticles(clamp(bl.x, 0, W), clamp(bl.y, 0, H), bl.vx, bl.vy);
      bullets.splice(i, 1);
    }
  }
}

function playCrackSound(rate, xNorm) {

function updateMotor(active, rate) {

}

function seedFirePass(arr, f) {
  for (let i = 0; i < arr.length - 1; i++) {
    const a = arr[i];
    const bp = arr[i + 1];
    const ax = a.px + (a.x - a.px) * f;
    const ay = a.py + (a.y - a.py) * f;
    const bx = bp.px + (bp.x - bp.px) * f;
    const by = bp.py + (bp.y - bp.py) * f;
    const steps = Math.max(1, Math.ceil((Math.abs(bx - ax) + Math.abs(by - ay)) / FIRE_SCALE));
    for (let s = 0; s <= steps; s++) {
      const x = ((ax + (bx - ax) * s / steps) / FIRE_SCALE) | 0;
      const y = ((ay + (by - ay) * s / steps) / FIRE_SCALE) | 0;
      if (x >= 0 && x < fireGW && y >= 1 && y < fireGH) {
        fireGrid[y * fireGW + x] = FIRE_MAX;
        if (y < fireTop) fireTop = y;
        if (y > fireBottom) fireBottom = y;
      }
    }
  }
}

function seedFireAlong(arr) {
  if (!fireGrid) return;
  let maxMove = 0;
  for (const p of arr) {
    const d = Math.abs(p.x - p.px) + Math.abs(p.y - p.py);
    if (d > maxMove) maxMove = d;
  }
  const passes = Math.min(12, Math.max(1, Math.ceil(maxMove / (FIRE_SCALE * 3))));
  for (let k = 1; k <= passes; k++) {
    seedFirePass(arr, k / passes);
  }
  fireActive = 220;
  ensureHeatCapture();
}

function stepFire() {
  fireFrame++;
  const extraDecay = fireFrame % 3 === 0 ? 2 : 0;
  const yEnd = Math.min(fireGH - 1, fireBottom);
  const yStart = Math.max(1, fireTop);
  const ltr = (fireFrame & 1) === 0;
  for (let y = yStart; y <= yEnd; y++) {
    const row = y * fireGW;
    const above = row - fireGW;
    const xFrom = ltr ? 0 : fireGW - 1;
    const xTo = ltr ? fireGW : -1;
    const xStep = ltr ? 1 : -1;
    for (let x = xFrom; x !== xTo; x += xStep) {
      const src = fireGrid[row + x];
      if (src === 0) {
        fireGrid[above + x] = 0;
        continue;
      }
      const rnd = (Math.random() * 3) | 0;
      let dx = x - rnd + 1;
      if (dx < 0) dx = 0; else if (dx >= fireGW) dx = fireGW - 1;
      const v = src - ((Math.random() * 6.5) | 0) - extraDecay;
      fireGrid[above + dx] = v > 0 ? v : 0;
    }
  }
  const bRow = yEnd * fireGW;
  for (let x = 0; x < fireGW; x++) {
    const src = fireGrid[bRow + x];
    if (src > 0) {
      fireGrid[bRow + x] = src - 1;
    }
  }
  fireTop = Math.max(1, fireTop - 1);
  while (fireTop < yEnd) {
    const r = fireTop * fireGW;
    let any = false;
    for (let x = 0; x < fireGW; x++) {
      if (fireGrid[r + x]) { any = true; break; }
    }
    if (any) break;
    fireTop++;
  }
  const rTop = Math.max(0, fireTop - 1);
  const d = fireImg.data;
  for (let y = rTop; y <= yEnd; y++) {
    const row = y * fireGW;
    let mn = 32767;
    let mx = -1;
    let cnt = 0;
    for (let x = 0; x < fireGW; x++) {
      const h = fireGrid[row + x];
      const pal = FIRE_PALETTE[h];
      const o = (row + x) * 4;
      d[o] = pal[0];
      d[o + 1] = pal[1];
      d[o + 2] = pal[2];
      d[o + 3] = pal[3];
      if (h > 8) {
        if (x < mn) mn = x;
        if (x > mx) mx = x;
        cnt++;
      }
    }
    rowMin[y] = mn;
    rowMax[y] = mx;
    rowCnt[y] = cnt;
  }
  fireRTop = rTop;
  fireREnd = yEnd;
  fctx.putImageData(fireImg, 0, 0, 0, rTop, fireGW, yEnd - rTop + 1);
}



function drawFire() {
  if (fireActive <= 0) return;
  fireActive--;
  if (fireActive === 0) {
    fireGrid.fill(0);
    fireTop = fireGH;
    fireBottom = 0;
    fireREnd = -1;
    fctx.clearRect(0, 0, fireGW, fireGH);
    stopHeatCapture();
    return;
  }
  stepFire();
  ctx.save();
  ctx.drawImage(fireCv, 0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const sway = Math.sin(fireFrame * 0.22) * 2.5;
  ctx.globalAlpha = 0.16;
  ctx.drawImage(fireCv, sway, -3, W, H);
  ctx.globalAlpha = 0.1;
  ctx.drawImage(fireCv, -sway, -6, W, H);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawMachine(hx, hy, endPt) {
  ctx.save();
  ctx.lineCap = 'round';

  ctx.strokeStyle = '#555';
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(hx, hy + 14);
  ctx.lineTo(hx, hy + 54);
  ctx.stroke();
  ctx.strokeStyle = '#8a8a8a';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(hx, hy + 16);
  ctx.lineTo(hx, hy + 51);
  ctx.stroke();

  ctx.strokeStyle = '#666';
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(endPt.x, endPt.y);
  ctx.stroke();
  ctx.strokeStyle = '#a8a8a8';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(endPt.x, endPt.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(hx, hy, 14, 0, Math.PI * 2);
  ctx.fillStyle = '#4a4a4a';

  ctx.strokeStyle = '#c8c8c8';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(hx, hy, 4, 0, Math.PI * 2);

  ctx.beginPath();
  ctx.arc(endPt.x, endPt.y, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#888';
  ctx.fill();
  ctx.strokeStyle = '#c8c8c8';
  ctx.lineWidth = 2;

}

function drawWhipName(w, name, color) {

function updateHandleAim() {
  if (dropping || myWhipType === 'machine') return;
  const mvx = mouseX - prevMouseX;
  const mvy = mouseY - prevMouseY;
  const delta = clamp(
    mvx * P.handleAimByMouseX + mvy * P.handleAimByMouseY,
    -P.handleAimClamp,
    P.handleAimClamp
  );
  const target = P.baseTargetAngle + delta;
  const err = wrapPi(target - handleAngle);
  handleAngVel += err * P.handleSpring;
  handleAngVel *= P.handleAngularDamping;
  handleAngle = wrapPi(handleAngle + handleAngVel);
}

function applyMachinePose() {
  if (!whip || dropping || myWhipType !== 'machine') return;
  const dx = Math.cos(machineAngle);
  const dy = Math.sin(machineAngle);
  const guided = Math.min(P.machinePoseSegments, whip.length - 1);
  for (let i = 1; i <= guided; i++) {
    const prev = whip[i - 1];
    const p = whip[i];
    const targetLen = segLen(i - 1);
    const tx = prev.x + dx * targetLen;
    const ty = prev.y + dy * targetLen;
    p.x = lerp(p.x, tx, P.machinePoseStiff);
    p.y = lerp(p.y, ty, P.machinePoseStiff);
  }
}

function applyBasePose() {
  if (!whip || dropping || myWhipType === 'machine') return;
  const dx = Math.cos(handleAngle);
  const dy = Math.sin(handleAngle);
  const guided = Math.min(P.basePoseSegments, whip.length - 1);
  for (let i = 1; i <= guided; i++) {
    const t = (i - 1) / Math.max(guided - 1, 1);
    const stiff = lerp(P.basePoseStiffStart, P.basePoseStiffEnd, t);
    const prev = whip[i - 1];
    const p = whip[i];
    const targetLen = segLen(i - 1);
    const tx = prev.x + dx * targetLen;
    const ty = prev.y + dy * targetLen;
    p.x = lerp(p.x, tx, stiff);
    p.y = lerp(p.y, ty, stiff);
  }
}

function applyBendLimits() {
  if (!whip || whip.length < 3) return;
  for (let i = 1; i < whip.length - 1; i++) {
    const a = whip[i - 1];
    const b = whip[i];
    const c = whip[i + 1];

    const v1x = a.x - b.x;
    const v1y = a.y - b.y;
    const v2x = c.x - b.x;
    const v2y = c.y - b.y;
    const l1 = Math.hypot(v1x, v1y) || 0.0001;
    const l2 = Math.hypot(v2x, v2y) || 0.0001;
    const n1x = v1x / l1, n1y = v1y / l1;
    const n2x = v2x / l2, n2y = v2y / l2;

    const dot = clamp(n1x * n2x + n1y * n2y, -1, 1);
    const angle = Math.acos(dot);
    const t = i / (whip.length - 2);
    const maxBend = lerp(P.handleMaxBendDeg, P.tipMaxBendDeg, t) * Math.PI / 180;
    const bend = Math.PI - angle;
    if (bend <= maxBend) continue;

    const cross = n1x * n2y - n1y * n2x;
    const sign = cross >= 0 ? 1 : -1;
    const targetAngle = Math.PI - maxBend;
    const targetA = Math.atan2(n1y, n1x) + sign * targetAngle;
    const tx = b.x + Math.cos(targetA) * l2;
    const ty = b.y + Math.sin(targetA) * l2;
    const rigidity = lerp(P.bendRigidityStart, P.bendRigidityEnd, t);

    c.x = lerp(c.x, tx, rigidity);
    c.y = lerp(c.y, ty, rigidity);
  }
}

function capSegmentStretch() {
  if (!whip || whip.length < 2) return;
  for (let i = 0; i < whip.length - 1; i++) {
    const a = whip[i];
    const b = whip[i + 1];
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 0.0001;
    const maxLen = segLen(i) * P.maxStretchRatio;
    if (dist <= maxLen) continue;
    const k = maxLen / dist;
    b.x = a.x + dx * k;
    b.y = a.y + dy * k;
  }
}

function applyWallCollisions() {
  if (!whip || dropping) return;
  const start = 1;
  for (let i = start; i < whip.length; i++) {
    const p = whip[i];
    let vx = p.x - p.px;
    let vy = p.y - p.py;
    let hit = false;

    if (p.x < 0) {
      p.x = 0;
      if (vx < 0) vx = -vx * P.wallBounce;
      vy *= P.wallFriction;
      hit = true;
    } else if (p.x > W) {
      p.x = W;
      if (vx > 0) vx = -vx * P.wallBounce;
      vy *= P.wallFriction;
      hit = true;
    }

    if (p.y < 0) {
      p.y = 0;
      if (vy < 0) vy = -vy * P.wallBounce;
      vx *= P.wallFriction;
      hit = true;
    } else if (p.y > H) {
      p.y = H;
      if (vy > 0) vy = -vy * P.wallBounce;
      vx *= P.wallFriction;
      hit = true;
    }

    if (hit) {
      p.px = p.x - vx;
      p.py = p.y - vy;
    }
  }
}

function distToSegment(px0, py0, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(px0 - x1, py0 - y1);
  let t = ((px0 - x1) * dx + (py0 - y1) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px0 - (x1 + t * dx), py0 - (y1 + t * dy));
}

const lastHitByVictim = new Map();

function whipTouches(cx, cy, from) {
  for (let i = whip.length - 1; i >= from; i--) {
    const p = whip[i];
    if (distToSegment(cx, cy, p.px, p.py, p.x, p.y) <= P.hitRadius) return i;
    if (i > 0) {
      const q = whip[i - 1];
      if (distToSegment(cx, cy, q.x, q.y, p.x, p.y) <= P.hitRadius) return i;
      if (distToSegment(cx, cy, q.px, q.py, p.px, p.py) <= P.hitRadius) return i;
    }
  }
  return -1;
}

function checkVictimHits(now) {
  if (remoteMode || !whip || dropping || myWhipType === 'gun') return;
  const from = 0;
  const minSpeed = myWhipType === 'machine' ? P.machineHitSpeed : P.hitSpeed;
  for (const [vid, c] of victimCursors) {
    if (now - c.t > 2000) continue;
    const last = lastHitByVictim.get(vid) || 0;
    if (now - last < P.knockCooldownMs) continue;
    const idx = whipTouches(c.x, c.y, from);
    if (idx < 0) continue;
    const p = whip[idx];
    const pvx = p.x - p.px;
    const pvy = p.y - p.py;
    const speed = Math.hypot(pvx, pvy);
    if (speed < minSpeed) continue;
    let k = Math.min(speed * P.knockScale, P.knockMax);
    if (myWhipType === 'fire') {
      const boost = 1 + 1.5 * Math.min(1, Math.max(0, speed - P.hitSpeed) / 60);
      k = Math.min(speed * P.knockScale * boost, P.knockMax * 2.5);
    } else if (myWhipType === 'long') {
      k = Math.min(speed * P.knockScale, P.knockMax * 1.35);
    }
    window.bridge.sendHit(vid, pvx / speed * k, pvy / speed * k);
    simulateKnockThuds(c.x, c.y, pvx / speed * k, pvy / speed * k);
    lastHitByVictim.set(vid, now);
    if (myWhipType === 'machine') {
      lastMachineHit = now;
      if (now - lastContactCrack > 450) {
        lastContactCrack = now;
        playCrackSound(1, c.x / W);
        window.bridge.whipCrack(c.x / W);
      }
    }
  }
}

function update() {
  const now = Date.now();
  let anyMachine = false;
  for (const [id, rw] of remoteWhips) {
    if (now - rw.t > 3000) { remoteWhips.delete(id); continue; }
    if (rw.type === 'fire') seedFireAlong(rw.pts);
    if (rw.type === 'machine') anyMachine = true;
  }
  for (const [id, c] of victimCursors) {
    if (now - c.t > 3000) victimCursors.delete(id);
  }

  const ownMachine = !remoteMode && myWhipType === 'machine' && whip && !dropping;
  if (ownMachine) anyMachine = true;
  updateMotor(anyMachine, ownMachine ? 0.85 + (machineSpeed / P.machineBaseSpeed - 1) * 0.45 : 1);

  updateBullets(now);
  updateSparks();
  gunRecoil *= 0.85;
  if (gunRecoil < 0.02) gunRecoil = 0;
  updateSmokes();
  if (!remoteMode && myWhipType === 'gun' && whip && !dropping) updateGun(now);

  if (!whip && remoteWhips.size === 0 && hadContent) {
    hadContent = false;
    stopHeatCapture();
    window.bridge.hideOverlay();
  }

  if (!whip) return;

  if (myWhipType === 'fire') seedFireAlong(whip);

  if (ownMachine) {
    machineHubX = mouseX;
    machineHubY = mouseY;
    const target = P.machineBaseSpeed * (now - lastMachineHit < 1200 ? P.machineMaxMult : 1);
    machineSpeed += (target - machineSpeed) * 0.05;
    machineAngle = wrapPi(machineAngle + machineSpeed);
  }

  const g = dropping ? P.dropGravity : P.gravity;
  updateHandleAim();

  const start = dropping ? 0 : 1;
  for (let i = start; i < whip.length; i++) {
    const p = whip[i];
    const vx = (p.x - p.px) * P.damping;
    const vy = (p.y - p.py) * P.damping;
    p.px = p.x;
    p.py = p.y;
    p.x += vx;
    p.y += vy + g;
  }

  if (!dropping) {
    if (myWhipType === 'machine') {
      const hx = machineHubX + Math.cos(machineAngle) * P.machineBarLen;
      const hy = machineHubY + Math.sin(machineAngle) * P.machineBarLen;
      whip[0].px = whip[0].x;
      whip[0].py = whip[0].y;
      whip[0].x = hx;
      whip[0].y = hy;
    } else {
      whip[0].x = mouseX;
      whip[0].y = mouseY;
      whip[0].px = mouseX;
      whip[0].py = mouseY;
    }
  }

  capSegmentStretch();
  applyWallCollisions();

  applyBasePose();
  applyMachinePose();

  for (let iter = 0; iter < P.constraintIters; iter++) {
    for (let i = 0; i < whip.length - 1; i++) {
      const a = whip[i], b = whip[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      const target = segLen(i);
      const diff = (dist - target) / dist * 0.5;
      const ox = dx * diff, oy = dy * diff;
      if (i === 0 && !dropping) {
        b.x -= ox * 2;
        b.y -= oy * 2;
      } else {
        a.x += ox; a.y += oy;
        b.x -= ox; b.y -= oy;
      }
    }
    applyBendLimits();
    if (!dropping) {
      applyBasePose();
      applyMachinePose();
    }
    capSegmentStretch();
    applyWallCollisions();
  }

  const tip = whip[whip.length - 1];
  const tipVel = Math.hypot(tip.x - tip.px, tip.y - tip.py);

  checkVictimHits(now);

  if (!dropping && myWhipType !== 'machine' && myWhipType !== 'gun' && tipVel > P.crackSpeed) {
    if (now - whipSpawnTime >= P.firstCrackGraceMs && now - lastCrackTime > P.crackCooldownMs) {
      lastCrackTime = now;
      playCrackSound(myWhipType === 'long' ? 0.85 : 1, tip.x / W);
      window.bridge.whipCrack(tip.x / W);
    }
  }

  if (whip) {
    const flat = [];
    for (const p of whip) {
      flat.push(Math.round(p.x / W * 10000) / 10000, Math.round(p.y / H * 10000) / 10000);
    }
    const state = { p: flat };
    if (myWhipType === 'machine' && !dropping) {
      state.m = [
        Math.round(machineHubX / W * 10000) / 10000,
        Math.round(machineHubY / H * 10000) / 10000,
      ];
    }
    if (myWhipType === 'gun') {
      state.g = [Math.round(gunAngle * 1000) / 1000, gunFlip ? 1 : 0, Math.round(gunRecoil * 100) / 100];
      if (bullets.length) {
        state.b = [];
        for (const bl of bullets) {
          state.b.push(
            Math.round(bl.x / W * 10000) / 10000,
            Math.round(bl.y / H * 10000) / 10000,
            Math.round(bl.vx * 10) / 10,
            Math.round(bl.vy * 10) / 10
          );
        }
      }
    }
    window.bridge.sendWhipState(state);
  }

  if (dropping && whip.every(p => p.y > H + 60)) {
    whip = null;
    dropping = false;
    window.bridge.ownGone();
    window.bridge.setCapture(false);
  }
  prevMouseX = mouseX;
  prevMouseY = mouseY;
}

function drawVictimCursors() {
  const now = Date.now();
  for (const c of victimCursors.values()) {
    if (now - c.t > 2000) continue;
    const fill = c.color || '#22c55e';
    const outline = autoOutline(fill);
    ctx.save();
    ctx.translate(c.x, c.y);

    let drewImage = false;
    if (c.cur && c.cur !== 'default') {
      const img = cursorImg(c.cur);
      if (img.complete && img.naturalWidth > 0) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0, 22, 22);
        ctx.imageSmoothingEnabled = true;
        drewImage = true;
      }
    }

    if (!drewImage) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 19);
      ctx.lineTo(5, 14.5);
      ctx.lineTo(8.5, 21.5);
      ctx.lineTo(11, 20);
      ctx.lineTo(7.5, 13.5);
      ctx.lineTo(14, 13);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.strokeStyle = outline;
      ctx.lineWidth = 1.5;
      ctx.lineJoin = 'round';
      ctx.fill();
      ctx.stroke();
    }

    if (c.name) {
      const tx = drewImage ? 11 : 7;
      ctx.font = '600 13px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = fill;
      ctx.fillText(c.name, tx, 36);
    }
    ctx.restore();
  }
}

function drawWhip(w, color) {
  if (!w || w.length < 2) return;

  const core = color || '#111';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = haloFor(core);
  ctx.beginPath();
  ctx.moveTo(w[0].x, w[0].y);
  for (let i = 0; i < w.length - 1; i++) {
    const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(w, i);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
  }
  ctx.lineWidth = P.lineWidthTip + P.outlineWidth * 2;
  ctx.stroke();

  const thickLinks = Math.min(P.handleThickSegments, w.length - 1);
  if (thickLinks > 0 && P.handleExtraWidth > 0) {
    ctx.beginPath();
    ctx.moveTo(w[0].x, w[0].y);
    for (let i = 0; i < thickLinks; i++) {
      const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(w, i);
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
    }
    ctx.lineWidth =
      P.lineWidthHandle + P.handleExtraWidth + P.outlineWidth * 2;
    ctx.stroke();
  }

  ctx.strokeStyle = core;
  for (let i = 0; i < w.length - 1; i++) {
    const t = i / Math.max(1, w.length - 2);
    const extra = i < P.handleThickSegments ? P.handleExtraWidth : 0;
    ctx.lineWidth = lerp(P.lineWidthHandle, P.lineWidthTip, t) + extra;
    const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(w, i);
    ctx.beginPath();
    ctx.moveTo(w[i].x, w[i].y);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
    ctx.stroke();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = `rgba(0,0,0,${P.bgAlpha})`;
  ctx.fillRect(0, 0, W, H);

  drawHeatShader();
  drawVictimCursors();

  for (const rw of remoteWhips.values()) {
    if (rw.machine && rw.pts.length) {
      drawMachine(rw.machine[0] * W, rw.machine[1] * H, rw.pts[0]);
    }
    if (rw.type === 'gun' && rw.pts.length && rw.gun) {
      const rec = rw.gun[2] || 0;
      if (rec > 0.8 && (rw.prevRecoil || 0) < 0.5) {
        const mm = gunMuzzle(rw.pts[0].x, rw.pts[0].y, rw.gun[0], !!rw.gun[1]);
        addMuzzleFlash(mm.x, mm.y);
      }
      rw.prevRecoil = rec;
      drawGun(ctx, rw.pts[0].x, rw.pts[0].y, rw.gun[0], !!rw.gun[1], rec);
      if (rw.bullets) {
        for (const bl of rw.bullets) drawBullet(ctx, bl);
      }
    } else {
      drawWhip(rw.pts, rw.color);
    }
    drawWhipName(rw.pts, rw.name, rw.color);
  }
  if (whip) {
    if (myWhipType === 'machine' && !dropping) {
      drawMachine(machineHubX, machineHubY, whip[0]);
    }
    if (myWhipType === 'gun') {
      drawGun(ctx, whip[0].x, whip[0].y, gunAngle, gunFlip, gunRecoil);
    } else {
      drawWhip(whip, myColor);
    }
    drawWhipName(whip, myName, myColor);
  }
  for (const bl of bullets) drawBullet(ctx, bl);
  drawSmokes();
  drawSparks();
  drawFire();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

window.bridge.onSpawnWhip(() => {
  if (remoteMode) return;
  whip = spawnWhip(mouseX || W / 2, mouseY || H / 2);
  dropping = false;
  hadContent = true;
  prevMouseX = mouseX;
  prevMouseY = mouseY;
  handleAngle = P.baseTargetAngle;
  handleAngVel = 0;
  window.bridge.setCapture(!myClickThrough);
  if (myWhipType === 'gun') {
    sndBuf('gunfire.mp3').catch(() => {});
    sndBuf('cursorimpact.wav').catch(() => {});
  }
});

window.bridge.onDropWhip(() => {
  if (remoteMode) return;
  if (whip && !dropping) dropping = true;
});

window.bridge.onSetMode((mode, color, name, mutedArg, volume, whipType, clickThrough, manualFireArg) => {
  remoteMode = (mode === 'remote');
  if (typeof color === 'string' && /^#[0-9a-fA-F]{6}$/.test(color)) myColor = color;
  if (typeof name === 'string') myName = name;
  muted = !!mutedArg;
  if (typeof volume === 'number') myVolume = Math.max(0, Math.min(1, volume));
  if (['normal', 'long', 'fire', 'machine', 'gun'].includes(whipType)) myWhipType = whipType;
  myClickThrough = !!clickThrough;
  manualFire = !!manualFireArg;
});

window.bridge.onFireGun(() => {
  fireGunNow();
});

window.bridge.onSelfHit((vx, vy) => {
  if (localMouseX !== null) {
    spawnSparks(localMouseX, localMouseY, vx, vy);
    playImpact(localMouseX / W);
  }
});

window.bridge.onOtherHit((to, vx, vy, kind) => {
  const c = victimCursors.get(to);
  if (!c) return;
  if (kind === 'gun') {
    spawnSparks(c.x, c.y, vx, vy);
    playImpact(c.x / W);
  }
  simulateKnockThuds(c.x, c.y, vx, vy);
});

window.bridge.onWallThud((intensity, x) => {
  if (typeof intensity === 'number') playThud(Math.max(0, Math.min(1, intensity)), x);
});

window.bridge.onSetMuted(m => {
  muted = !!m;
});

window.bridge.onRemoteWhip((id, pts, color, type, name, machine, gun, bullets2) => {
  const n = Math.floor(pts.length / 2);
  const now = Date.now();
  const safeColor = typeof color === 'string' && /^#[0-9a-fA-F]{6}$/.test(color) ? color : '#111111';
  const safeType = ['normal', 'long', 'fire', 'machine', 'gun'].includes(type) ? type : 'normal';
  const safeName = typeof name === 'string' ? name.slice(0, 20) : '';
  const safeMachine = Array.isArray(machine) && machine.length >= 2
    && typeof machine[0] === 'number' && typeof machine[1] === 'number'
    ? machine : null;
  const safeGun = Array.isArray(gun) && gun.length >= 2 && typeof gun[0] === 'number'
    ? gun : null;
  let safeBullets = null;
  if (Array.isArray(bullets2) && bullets2.length >= 4) {
    safeBullets = [];
    for (let i = 0; i + 3 < bullets2.length; i += 4) {
      safeBullets.push({
        x: bullets2[i] * W,
        y: bullets2[i + 1] * H,
        vx: bullets2[i + 2],
        vy: bullets2[i + 3],
      });
    }
  }
  let rw = remoteWhips.get(id);
  if (!rw || rw.pts.length !== n) {
    const arr = [];
    for (let i = 0; i < n; i++) {
      const x = pts[i * 2] * W;
      const y = pts[i * 2 + 1] * H;
      arr.push({ x, y, px: x, py: y });
    }
    remoteWhips.set(id, { pts: arr, t: now, color: safeColor, type: safeType, name: safeName, machine: safeMachine, gun: safeGun, bullets: safeBullets });
  } else {
    for (let i = 0; i < n; i++) {
      const w = rw.pts[i];
      w.px = w.x;
      w.py = w.y;
      w.x = pts[i * 2] * W;
      w.y = pts[i * 2 + 1] * H;
    }
    rw.t = now;
    rw.color = safeColor;
    rw.type = safeType;
    rw.name = safeName;
    rw.machine = safeMachine;
    rw.gun = safeGun;
    rw.bullets = safeBullets;
  }
  hadContent = true;
});

window.bridge.onRemoteGone(id => {
  remoteWhips.delete(id);
});

window.bridge.onRemoteCrack((t, x) => {
  if (t === 'gun') {
    playGunfire(x);
  } else {
    playCrackSound(t === 'long' ? 0.85 : 1, x);
  }
});

window.bridge.onVictimMouse((id, x, y, name, color, cur) => {
  victimCursors.set(id, {
    x: x * W,
    y: y * H,
    t: Date.now(),
    name: typeof name === 'string' ? name.slice(0, 20) : '',
    color: typeof color === 'string' && /^#[0-9a-fA-F]{6}$/.test(color) ? color : '#22c55e',
    cur: typeof cur === 'string' && /^[\w.-]+\.png$/.test(cur) ? cur : 'default',
  });
});

window.bridge.onLocalMouse((x, y) => {
  localMouseX = x;
  localMouseY = y;
  if (!remoteMode && myClickThrough) {
    mouseX = x;
    mouseY = y;
  }
});

</script>
</body>
